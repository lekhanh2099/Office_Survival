<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17172b">
<meta name="description" content="Office Survival - Sinh tồn chốn công sở, một game thẻ bài hài phi lý có chiến thuật, chơi offline.">
<title>Office Survival — Đừng để công ty nuốt chửng bạn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#17172b;--muted:#55546c;--purple:#6957ec;--yellow:#f4f5ab;--pink:#ffb9d8;--mint:#b7f7df;--paper:#fffdf8;--bg:#eeeeff;--red:#e94b7d;--border:3px solid var(--ink);--shadow:5px 5px 0 var(--ink);font-family:'Nunito',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:radial-gradient(circle at 10% 20%,#d6d0ff,transparent 40%),radial-gradient(circle at 80% 0,#fce5fd,transparent 38%),#eeefff;user-select:none;-webkit-user-select:none}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{opacity:.55;cursor:default}
button:focus-visible{outline:4px solid var(--purple);outline-offset:3px}
.app{max-width:550px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 28px);min-height:100dvh;transition:transform .15s}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:0;font-size:16px}
.brandMark{width:38px;height:38px;border:var(--border);border-radius:11px;box-shadow:3px 3px 0 var(--ink);background:#e4fc83;display:grid;place-items:center;transform:rotate(-5deg);font-weight:900;font-size:16px}
.topActions{display:flex;align-items:center;gap:5px}
.miniButton{display:inline-flex;align-items:center;justify-content:center;gap:4px;border:2px solid var(--ink);background:#fff;border-radius:12px;padding:7px 9px;font-weight:800;font-size:12px;box-shadow:2px 2px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.miniButton:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.hidden{display:none!important}
.panel{background:var(--paper);border:var(--border);border-radius:22px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px;position:relative}
.eyebrow{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--purple)}
h1{font-size:clamp(34px,8.5vw,50px);line-height:1.15;margin:12px 0 14px;letter-spacing:0;font-weight:900}
h2{font-size:24px;line-height:1.28;letter-spacing:0;margin:6px 0 12px;font-weight:900}
h3{margin:0;font-size:17px;font-weight:800}
p{line-height:1.55;margin:0 0 12px}
.intro{overflow:hidden;background:var(--yellow)}
.intro .emojiLarge{font-size:78px;text-align:center;filter:drop-shadow(4px 6px 0 rgba(23,23,43,.25));padding:16px 0 10px}
.introBlurb{font-weight:600;font-size:15px;max-width:390px;line-height:1.55}
.stamp{display:inline-block;border:2px dashed var(--ink);padding:7px 9px;border-radius:9px;font-weight:800;font-size:12px;transform:rotate(3deg);background:var(--pink)}
.primary{width:100%;border:var(--border);background:#a6f3ca;box-shadow:var(--shadow);border-radius:15px;padding:15px 16px;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s,box-shadow .12s}
.primary:active,.choice:active,.perkCard:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.secondary{width:100%;border:2px solid var(--ink);background:white;border-radius:12px;padding:11px 12px;font-size:13px;font-weight:800;box-shadow:2px 2px 0 var(--ink)}
.secondary:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.buttons{display:grid;gap:11px}
.note{font-size:12px;color:#51506b;line-height:1.5}
.smallcaps{text-transform:uppercase;letter-spacing:.8px;font-size:10px;font-weight:800}
.introFeatures{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.feature{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:12px 6px;text-align:center;font-weight:800;font-size:12px}
.feature span{display:block;font-size:24px;margin-bottom:5px}
.screenHeader{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px}
.dayName{font-weight:900;font-size:24px;letter-spacing:0}
.clock{font-size:16px;font-weight:900;border:2px solid var(--ink);background:#e4fc83;border-radius:10px;padding:6px 9px;white-space:nowrap}
.daySub{font-size:11px;font-weight:800;color:var(--muted);margin:2px 0 0}
.progress{height:11px;border:2px solid var(--ink);border-radius:12px;background:#d9d5eb;overflow:hidden;margin-bottom:14px}
.progressFill{height:100%;background:var(--purple);transition:width .25s ease-out}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:9px}
.hudItem{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:9px;min-height:77px;transition:box-shadow .3s,border-color .3s}
.hudLabel{font-size:11px;font-weight:800;color:#55546c;margin-bottom:5px;white-space:nowrap}
.hudValue{font-size:18px;font-weight:900;letter-spacing:0}
.miniBar{height:7px;border-radius:20px;background:#e7e5ef;margin-top:8px;overflow:hidden;border:1px solid #38334d}
.miniBarInner{height:100%;transition:width .3s ease-out}
.heartFull{color:#ef456a}
.heartEmpty{color:#aaa8bd}
.wideStatus{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;font-size:11px;font-weight:800}
.modifier{margin:10px 0;font-size:11px;font-weight:800;background:#fff3c7;border:2px dashed #ba8537;border-radius:10px;padding:9px 10px;line-height:1.45}
.perkBar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.perkBadge{display:inline-flex;align-items:center;gap:4px;background:#eef2ff;border:1.5px solid var(--ink);border-radius:8px;padding:4px 7px;font-size:11px;font-weight:800;box-shadow:1.5px 1.5px 0 var(--ink)}
.card{background:var(--paper);border:var(--border);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;margin:14px 0 16px;animation:cardPop .22s cubic-bezier(.175,.885,.32,1.275)}
@keyframes cardPop{0%{opacity:0;transform:translateY(12px) scale(.98)}100%{opacity:1;transform:translateY(0) scale(1)}}
.cardTop{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#dcd4ff;border-bottom:var(--border);padding:11px 14px;font-size:11px;font-weight:900}
.cardTop.special{background:var(--pink)}
.cardTop.crisis{background:#ffc9bb}
.cardTop.rare{background:#f9dd91}
.cardTop.callback{background:#b7f7df}
.cardBody{padding:17px 18px 20px}
.sender{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.avatar{width:54px;height:54px;flex-shrink:0;border:2px solid var(--ink);border-radius:15px;background:var(--yellow);display:grid;place-items:center;font-size:28px;transform:rotate(-5deg)}
.senderTitle{font-size:15px;font-weight:900}
.senderType{color:var(--muted);font-size:11px;font-weight:700;margin-top:3px}
.cardTitle{font-size:21px;line-height:1.25;letter-spacing:0;font-weight:900;margin:0 0 12px}
.speech{background:#f4f1ff;border:2px solid var(--ink);border-radius:17px 17px 17px 5px;padding:13px 15px;font-size:14.5px;line-height:1.6;font-weight:600;white-space:pre-line}
.choicesTitle{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;font-weight:900;font-size:12px}
.choice{width:100%;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:9px;box-shadow:3px 3px 0 var(--ink);display:block;transition:transform .12s,box-shadow .12s}
.choice:nth-of-type(3n+2){background:#f5ffde}
.choice:nth-of-type(3n+3){background:#fff0f6}
.choiceLabel{font-weight:900;font-size:14px;line-height:1.4}
.choiceHint{font-size:11px;color:#54536e;margin-top:5px;font-weight:700;line-height:1.4}
.footerHelp{text-align:center;margin:12px 0 14px;font-size:11px;color:#6b697d;font-weight:700}
.resultHeader{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.resultIcon{font-size:30px}
.resultBody{font-size:14.5px;font-weight:600;line-height:1.6}
.deltaList{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0}
.delta{padding:6px 9px;border:2px solid var(--ink);border-radius:9px;background:#f4f1ff;font-weight:800;font-size:12px}
.delta.good{background:var(--mint)}
.delta.bad{background:#ffdae2}
.nextNote{border-left:4px solid var(--purple);padding:9px 11px;background:#eceaff;border-radius:0 9px 9px 0;font-weight:700;font-size:12px;margin:10px 0;line-height:1.45}
.alertNote{border-left:4px solid var(--red);padding:9px 11px;background:#ffe7ee;border-radius:0 9px 9px 0;font-weight:800;font-size:12px;margin:10px 0;color:#9b1c41;line-height:1.45}
.divider{border-top:2px dashed #a9a6bc;margin:16px 0}
.statusBrief{background:#f8f5ff;border:2px dashed #b0a7db;border-radius:12px;padding:11px;font-size:12px;line-height:1.55}
.summaryGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}
.summaryBox{border:2px solid var(--ink);border-radius:12px;padding:12px;background:#f5f3ff}
.summaryBox strong{display:block;font-size:20px;font-weight:900}
.badgeText{background:#e9fcab;border:2px solid var(--ink);border-radius:9px;padding:7px 10px;font-weight:900;display:inline-block;font-size:12px;transform:rotate(-2deg);margin:8px 0 12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#17172b;color:#fff;padding:10px 16px;border-radius:10px;font-weight:800;font-size:12px;z-index:90;max-width:92%;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none;animation:cardPop .18s}
.outline{background:#fff;border:2px solid var(--ink);border-radius:11px;padding:9px 12px;font-weight:800;font-size:12px;box-shadow:2px 2px 0 var(--ink)}
.outline:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.utility{display:flex;justify-content:space-between;align-items:center;gap:7px;margin:13px 0}
.dialogShade{position:fixed;inset:0;background:#17172bbd;display:grid;place-items:center;padding:18px;z-index:100;backdrop-filter:blur(2px)}
.dialog{background:var(--paper);border:var(--border);box-shadow:var(--shadow);border-radius:20px;padding:18px;max-width:460px;width:100%;max-height:85dvh;overflow:auto}
.dialog p{font-size:13px;line-height:1.55}
.dialog h2{margin-top:0}
.dialog .secondary{margin-top:8px}
.privacy{font-size:11px;color:#65617d;text-align:center;margin-top:18px;line-height:1.5}
.tape{font-size:11px;font-weight:900;background:#fef1bd;border:2px solid var(--ink);transform:rotate(-3deg);display:inline-block;padding:5px 8px;margin-bottom:12px}
.shake{animation:shake .28s linear 2}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.dangerPulse{animation:dangerPulse 1.2s infinite;border-color:var(--red)!important}
@keyframes dangerPulse{0%,100%{box-shadow:0 0 0 0 rgba(233,75,125,0)}50%{box-shadow:0 0 0 4px rgba(233,75,125,.6)}}
.perkCard{background:#fff;border:2px solid var(--ink);border-radius:13px;padding:12px;margin-bottom:9px;text-align:left;box-shadow:3px 3px 0 var(--ink);display:block;width:100%;transition:transform .12s,box-shadow .12s}
.perkCard:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.perkCardTitle{font-weight:900;font-size:14px;display:flex;align-items:center;gap:6px}
.perkCardDesc{font-size:11.5px;color:#54536e;margin-top:4px;font-weight:700;line-height:1.45}
.compendiumGrid{display:grid;grid-template-columns:1fr;gap:7px;margin:12px 0}
.compCard{border:1.5px solid var(--ink);border-radius:10px;padding:9px;background:#fff;font-size:12px}
.compCard.locked{background:#f0edf8;color:#85839b;border-style:dashed}
.compCardHead{display:flex;align-items:center;justify-content:space-between;font-weight:800;margin-bottom:4px}
.compTag{font-size:9.5px;padding:2px 5px;border-radius:6px;border:1px solid var(--ink);font-weight:800}
.achGrid{display:grid;grid-template-columns:1fr;gap:7px;margin:12px 0}
.achItem{display:flex;align-items:center;gap:10px;border:1.5px solid var(--ink);border-radius:10px;padding:9px;background:#fff}
.achItem.unlocked{background:#f6ffec}
.achItem.locked{background:#f2eff9;opacity:.65}
.achIcon{font-size:26px;flex-shrink:0}
.achName{font-weight:900;font-size:13px}
.achDesc{font-size:11px;color:#615e75;margin-top:2px;line-height:1.4}
.scoreRow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e1deec;font-size:12.5px}
.scoreRow:last-child{border-bottom:0}
.scoreRank{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:inline-grid;place-items:center;font-size:11px;font-weight:900;margin-right:6px}
@media(min-width:640px){.app{padding-top:24px}.panel{padding:24px}.cardBody{padding:22px 24px 26px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.statPills { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 5px; }
.statPill { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--ink); background: #fff; box-shadow: 1px 1px 0 var(--ink); }
.statPill.e { background: #e6fcf0; color: #15693e; }
.statPill.b { background: #fff2eb; color: #9c3612; }
.statPill.r { background: #f0edff; color: #4331a8; }
.statPill.roll { background: #fff9db; color: #7a5800; }
.statPill.queue { background: #eafaf4; color: #0d5840; border-style: dashed; }
.choiceTeaser { font-size: 12px; font-weight: 700; color: #4b4863; line-height: 1.45; }
.hudHighlight { border-color: var(--purple) !important; box-shadow: 0 0 0 3px rgba(105, 87, 236, 0.45), 3px 3px 0 var(--ink) !important; transform: translateY(-3px) scale(1.02); transition: transform 0.15s ease, box-shadow 0.15s ease; }

</style>

<body>
<div class="app" id="appRoot">
<header class="top">
<div class="brand"><span class="brandMark">OS!</span><span>OFFICE SURVIVAL</span></div>
<div class="topActions">
<button id="audioToggle" class="miniButton" type="button" title="Bật/Tắt âm thanh" aria-label="Bật hoặc tắt âm thanh">🔊</button>
<button id="compBtn" class="miniButton" type="button" title="Sổ tay sự kiện">📚 Sổ tay</button>
<button id="rankBtn" class="miniButton" type="button" title="Bảng kỷ lục">🏆 Kỷ lục</button>
<button id="help" class="miniButton" type="button" title="Luật chơi">❔</button>
</div>
</header>
<main id="root" aria-live="polite"></main>
<footer class="privacy">Office Survival v1.0 · Hoàn toàn Offline · Tự lưu trên thiết bị</footer>
</div>
<div id="dialogHost"></div>
<script>
(()=>{'use strict';
const TIMES=['09:00','09:45','10:30','11:30','13:30','15:00','16:30','17:59'];
const KEY='office-survival-v03';
const KEY_DISCOVERED='office-survival-discovered';
const KEY_ACHS='office-survival-achs';
const KEY_SCORES='office-survival-highscores';
const KEY_MUTED='office-survival-muted';

// ==================== WEB AUDIO SOUND SYSTEM ====================
const Snd=(()=>{
  let ctx=null;
  let muted=localStorage.getItem(KEY_MUTED)==='1';
  function init(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC)ctx=new AC();
    }
    if(ctx&&ctx.state==='suspended')ctx.resume().catch(()=>{});
  }
  function tone(freq,type,dur,gStart,gEnd=0.001,delay=0){
    if(muted)return;
    try{
      init();
      if(!ctx)return;
      const t=ctx.currentTime+delay;
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type=type;
      osc.frequency.setValueAtTime(freq,t);
      gain.gain.setValueAtTime(gStart,t);
      gain.gain.exponentialRampToValueAtTime(gEnd,t+dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t+dur);
    }catch(_){}
  }
  return {
    isMuted:()=>muted,
    toggle:()=>{
      muted=!muted;
      localStorage.setItem(KEY_MUTED,muted?'1':'0');
      return muted;
    },
    click:()=>{tone(750,'sine',0.04,0.12,0.01);},
    card:()=>{tone(320,'triangle',0.06,0.1,0.01);tone(480,'triangle',0.07,0.09,0.01,0.03);},
    success:()=>{tone(523.25,'sine',0.09,0.14,0.01,0);tone(659.25,'sine',0.09,0.14,0.01,0.06);tone(783.99,'sine',0.18,0.16,0.01,0.12);},
    fail:()=>{tone(240,'sawtooth',0.1,0.14,0.01,0);tone(160,'sawtooth',0.2,0.16,0.01,0.07);},
    damage:()=>{tone(140,'square',0.16,0.22,0.01,0);tone(80,'sawtooth',0.24,0.24,0.01,0.05);},
    dayClear:()=>{tone(392,'sine',0.1,0.15,0.01,0);tone(523.25,'sine',0.1,0.15,0.01,0.08);tone(659.25,'sine',0.12,0.18,0.01,0.16);tone(783.99,'triangle',0.32,0.22,0.01,0.25);},
    over:()=>{tone(329.63,'sawtooth',0.18,0.16,0.01,0);tone(293.66,'sawtooth',0.22,0.16,0.01,0.14);tone(246.94,'sawtooth',0.4,0.18,0.01,0.29);},
    perk:()=>{tone(440,'triangle',0.09,0.15,0.01,0);tone(554.37,'triangle',0.1,0.16,0.01,0.07);tone(659.25,'sine',0.22,0.18,0.01,0.14);}
  };
})();

// ==================== PERKS (PHÚC LỢI CÔNG CỤ) ====================
const ALL_PERKS=[
  {id:'headphones',name:'Tai nghe chống ồn',emoji:'🎧',desc:'Giảm 1 năng lượng tiêu hao trong các cuộc họp.'},
  {id:'thermos',name:'Bình giữ nhiệt 1.5L',emoji:'☕',desc:'Sang ngày mới được hồi thêm +1 Năng lượng (tổng +5).'},
  {id:'leave_form',name:'Mẫu đơn nghỉ phép',emoji:'📑',desc:'Bảo hiểm: Tự động hoá giải 1 lần khủng hoảng Backlog (giảm 3 việc).'},
  {id:'sunglasses',name:'Kính râm ngủ gật',emoji:'🕶️',desc:'Bảo hiểm: Miễn nhiễm mất mạng lần đầu tiên khi năng lượng về 0.'},
  {id:'boba_card',name:'Thẻ tích điểm Phúc Long',emoji:'🧋',desc:'Mỗi lần giảm việc tồn được cộng thêm +5 điểm thưởng.'},
  {id:'power_strip',name:'Ổ cắm đa năng',emoji:'🔌',desc:'Tăng 15% tỷ lệ thành công của các lựa chọn may rủi 🎲.'},
  {id:'cactus',name:'Xương rồng để bàn',emoji:'🪴',desc:'Uy tín không bao giờ giảm xuống dưới 1 từ các lựa chọn thông thường.'},
  {id:'stress_ball',name:'Bóng xả stress',emoji:'🎾',desc:'Mỗi khi gặp thẻ Khủng hoảng, tự động hồi +1 Năng lượng.'}
];

// ==================== MODIFIERS ====================
const MODIFIERS=[
  {id:'normal',name:'BÌNH YÊN GIẢ TẠO',desc:'Không có hiệu ứng đặc biệt. Sự bình yên là đáng nghi.'},
  {id:'nocoffee',name:'CẤM CÀ PHÊ',desc:'Mọi lần hồi năng lượng từ thẻ bị giảm 1 (không xuống âm).'},
  {id:'kpi',name:'ĐẠI HỘI KPI',desc:'Mọi lựa chọn tăng việc tồn sẽ cộng thêm 1 việc.'},
  {id:'bonus',name:'CÔNG TY PHÁT BÁNH',desc:'Lần đầu giải quyết việc tồn trong ngày được +5 điểm thưởng.'},
  {id:'wifi',name:'WIFI CÓ LINH HỒN',desc:'Cơ hội rút thẻ hiếm tăng đáng kể.'}
];

// ==================== ACHIEVEMENTS ====================
const ALL_ACHS=[

const REG=Object.values(C).filter(x=>x.type==='base').map(x=>x.id);
const RARE=Object.values(C).filter(x=>x.type==='rare').map(x=>x.id);
const FIN=Object.values(C).filter(x=>x.type==='finale').map(x=>x.id);

const ROOT=document.getElementById('root'),HOST=document.getElementById('dialogHost'),APPROOT=document.getElementById('appRoot');
let S=null;

// ==================== HELPER STORAGE FUNCTIONS ====================
function getDiscovered(){try{return JSON.parse(localStorage.getItem(KEY_DISCOVERED))||[];}catch(_){return[];}}
function markDiscovered(id){
  if(!id)return;
  const list=getDiscovered();
  if(!list.includes(id)){
    list.push(id);
    try{localStorage.setItem(KEY_DISCOVERED,JSON.stringify(list));}catch(_){}
    if(list.length>=30)unlockAch('scholar');
  }
}
function getAchs(){try{return JSON.parse(localStorage.getItem(KEY_ACHS))||[];}catch(_){return[];}}
function unlockAch(id){
  const list=getAchs();
  if(!list.includes(id)){
    list.push(id);
    try{localStorage.setItem(KEY_ACHS,JSON.stringify(list));}catch(_){}
    const ach=ALL_ACHS.find(a=>a.id===id);
    if(ach){
      toast(`🏆 Mở khoá danh hiệu: ${ach.name}!`);
      Snd.success();
    }
  }
}
function getHighScores(){try{return JSON.parse(localStorage.getItem(KEY_SCORES))||[];}catch(_){return[];}}
function saveHighScore(){
  if(!S||S.score<=0)return;
  const list=getHighScores();
  const item={
    score:S.score,
    day:S.day,
    total:S.total,
    triggerCount:S.triggerCount||0,
    title:titleEnd(),
    date:new Date().toLocaleDateString('vi-VN')
  };
  list.push(item);
  list.sort((a,b)=>b.score-a.score||b.day-a.day);
  const top5=list.slice(0,5);
  try{localStorage.setItem(KEY_SCORES,JSON.stringify(top5));}catch(_){}
}

function esc(t){return String(t??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
function safeSave(){if(!S)return;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(_){}}
function safeLoad(){
  try{
    const data=JSON.parse(localStorage.getItem(KEY));
    if(!data||data.version!==3||!['play','result','day','over'].includes(data.stage))return null;
    if(!Number.isFinite(data.seed)||!Number.isFinite(data.day)||(!C[data.current]&&data.stage==='play'))return null;
    if(!Array.isArray(data.perks))data.perks=[];
    return data;
  }catch(_){return null;}
}

// Deterministic non-zero PRNG
function rnd(){
  if(!S.seed||S.seed===0)S.seed=(Date.now()>>>0)||123456789;
  let x=S.seed|0;
  x^=x<<13;x^=x>>>17;x^=x<<5;
  S.seed=x>>>0;
  if(S.seed===0)S.seed=123456789;
  return S.seed/4294967296;
}
function pick(xs){return xs[Math.floor(rnd()*xs.length)];}

function initial(){
  return {
    version:3,stage:'play',seed:(Date.now()>>>0)||1,
    day:1,turn:0,total:0,lives:3,e:8,b:2,r:3,score:0,cleanBonus:0,
    flag:{},pending:[],seen:{},last:[],current:null,lastResult:null,
    dailyStart:{lives:3,e:8,b:2,r:3,score:0},
    modifier:'normal',dayEnd:null,history:[],maxDay:0,triggerCount:0,
    perks:[],deathReason:''
  };
}

function hasPerk(id){return Array.isArray(S?.perks)&&S.perks.includes(id);}
function mod(){return MODIFIERS.find(m=>m.id===S.modifier)||MODIFIERS[0];}

function chooseCard(){
  if(S.turn===7){
    if(S.flag.printerBoss&&S.day>1&&S.total%3===1)return 'end_printer';
    const a=FIN.filter(x=>x!=='end_printer');
    return weighted(a);
  }
  if(S.turn===0&&S.day===1)return 'urgent';
  const due=S.pending.filter(x=>x.due<=S.total&&C[x.id]);
  if(due.length){
    due.sort((a,b)=>a.due-b.due);
    const selected=due[0];
    S.pending.splice(S.pending.indexOf(selected),1);
    return selected.id;
  }
  if((S.e<=2||S.b>=6||S.r<=1)&&rnd()<.54){
    if(S.e<=2)return 'energy_crisis';
    if(S.b>=6)return 'backlog_crisis';
    return 'rep_crisis';
  }
  const rareChance=S.modifier==='wifi'?.26:.11;
  if(S.day>=2&&rnd()<rareChance)return weighted(RARE);
  return weighted(REG);
}

function weighted(ids){
  let recent=S.last.slice(-Math.min(3,Math.max(1,ids.length-1)));
  let list=ids.filter(id=>!recent.includes(id));
  if(!list.length)list=ids;
  const weights=list.map(id=>Math.max(1,8-Math.min(7,(S.seen[id]||0)*3))),sum=weights.reduce((a,b)=>a+b,0);
  let n=rnd()*sum;
  for(let i=0;i<list.length;i++){
    n-=weights[i];
    if(n<=0)return list[i];
  }
  return list[list.length-1];
}

function prepare(){
  S.current=chooseCard();
  markDiscovered(S.current);
  S.seen[S.current]=(S.seen[S.current]||0)+1;
  S.last.push(S.current);
  if(S.last.length>12)S.last.shift();
  // Stress ball perk effect
  if(C[S.current]?.type==='crisis'&&hasPerk('stress_ball')){
    S.e=Math.min(10,S.e+1);
  }
  S.stage='play';
  safeSave();
  render();
  Snd.card();
}

function start(){
  S=initial();
  prepare();
}

function iconFor(k){return {e:'⚡',b:'📋',r:'⭐'}[k]||'';}
function statLabel(k){return {e:'Năng lượng',b:'Việc tồn',r:'Uy tín'}[k]||k;}
function statChange(before,after){
  let ret=[];
  for(const k of ['e','b','r']){
    const diff=after[k]-before[k];
    if(diff)ret.push({name:statLabel(k),label:iconFor(k)+' '+(diff>0?'+':'')+diff,good:k==='b'?diff<0:diff>0});
  }
  const dl=S.lives-before.lives;
  if(dl)ret.push({name:'Mạng',label:'❤️ '+dl,good:dl>0});
  return ret;
}

function maybeQueue(items){
  (items||[]).forEach(x=>{
    if(C[x.id]&&!S.pending.some(p=>p.id===x.id)){
      S.pending.push({id:x.id,due:S.total+x.delay});
    }
  });
}

function applyD(d,cardObj){
  const x={...d};
  if(S.modifier==='nocoffee'&&x.e>0)x.e=Math.max(0,x.e-1);
  if(S.modifier==='kpi'&&x.b>0)x.b+=1;
  // Headphones perk: reduces energy cost in meetings
  if(hasPerk('headphones')&&x.e<0&&(cardObj?.id?.includes('meeting')||cardObj?.title?.toLowerCase().includes('họp'))){
    x.e=Math.min(0,x.e+1);
  }
  // Cactus perk: protects reputation from hitting 0 in normal choices
  if(hasPerk('cactus')&&x.r<0&&(S.r+x.r)<1){
    x.r=Math.max(x.r,1-S.r);
  }
  S.e=Math.min(10,S.e+(x.e||0));
  S.b=Math.max(0,S.b+(x.b||0));
  S.r=Math.min(5,Math.max(0,S.r+(x.r||0)));
  return x;
}

function doChoice(index){
  if(S.stage!=='play')return;
  const cardObj=C[S.current],choice=cardObj.choices[index];
  if(!choice)return;

  // Haptics if available
  if(navigator.vibrate)navigator.vibrate(35);
  Snd.click();

  const before={e:S.e,b:S.b,r:S.r,lives:S.lives};
  let allMessages=[choice.message],queued=[],failureNotes=[];
  S.total++;S.turn++;S.score+=10;

  if(choice.flag)S.flag[choice.flag]=true;
  applyD(choice.d||{},cardObj);
  maybeQueue(choice.queue);
  if(choice.queue?.length)queued.push('Quyết định này có thể quay lại vào một lượt sau.');

  if(choice.roll){
    const bonus=hasPerk('power_strip')?0.15:0;
    const chance=Math.min(0.95,choice.roll.chance+bonus);
    const win=rnd()<chance;
    const part=win?choice.roll.win:choice.roll.lose;
    allMessages.push((win?'✨ THÀNH CÔNG: ':'💥 XUI RỦI: ')+part.message);
    applyD(part.d||{},cardObj);
    maybeQueue(part.queue);
    if(part.queue?.length)queued.push('Một hậu quả mới đã được ghi vào lịch.');
    if(win){
      unlockAch('gambler');
      Snd.success();
    }else{
      Snd.fail();
    }
  }

  if(cardObj.type==='callback'){S.score+=15;S.triggerCount++;}

  // Backlog reduction rewards
  const backlogBeforeSafety=S.b;
  const cleared=Math.max(0,before.b-backlogBeforeSafety);
  let reward=Math.min(20-S.cleanBonus,cleared*5);
  if(hasPerk('boba_card')&&cleared>0)reward+=5;
  if(reward>0){S.score+=reward;S.cleanBonus+=reward;}
  if(S.modifier==='bonus'&&cleared>0&&!S.flag['bonus_'+S.day]){
    S.score+=5;S.flag['bonus_'+S.day]=true;
  }

  // Check achievements
  if(S.r>=5)unlockAch('max_rep');
  if(S.b===0)unlockAch('clean_sheet');
  if(S.score>=500)unlockAch('score500');

  // Crisis / Failure conditions
  let failures=[];
  if(S.e<=0){
    if(hasPerk('sunglasses')){
      S.perks=S.perks.filter(p=>p!=='sunglasses');
      S.e=3;
      failureNotes.push('🕶️ Kính râm ngủ gật phát huy tác dụng! Sếp tưởng bạn đang suy tư sâu sắc. Thoát kiệt sức!');
    }else{
      failures.push('Kiệt sức');
      S.e=3;
      unlockAch('crisis_champ');
    }
  }
  if(S.b>=8){
    if(hasPerk('leave_form')){
      S.perks=S.perks.filter(p=>p!=='leave_form');
      S.b=Math.max(0,S.b-3);
      failureNotes.push('📑 Mẫu đơn nghỉ phép tự động kích hoạt! Tránh được khủng hoảng quá tải.');
    }else{
      failures.push('Backlog vượt ngưỡng');
      S.b=5;
      unlockAch('crisis_champ');
    }
  }

  S.lastTurnLostLife=failures.length>0;
  if(failures.length){
    S.lives--;
    Snd.damage();
    if(navigator.vibrate)navigator.vibrate([80,40,80]);
    if(APPROOT){
      APPROOT.classList.remove('shake');
      void APPROOT.offsetWidth;
      APPROOT.classList.add('shake');
    }
    failureNotes.push('🚨 '+failures.join(' + ')+': mất 1 mạng. Hệ thống đã hỗ trợ phục hồi tạm thời.');
  }

  if(S.r===0)queued.push('Uy tín đã chạm 0. Nếu không hồi phục trước cuối ngày, bạn sẽ mất 1 mạng.');

  const delta=statChange(before,{e:S.e,b:S.b,r:S.r,lives:S.lives});
  const fullMessage=allMessages.join('\n\n');

  S.history.unshift({day:S.day,time:TIMES[Math.max(0,S.turn-1)],card:cardObj.title,choice:choice.label});
  S.history=S.history.slice(0,15);

  if(S.lives<=0){
    S.stage='over';
    S.maxDay=S.day;
    S.deathReason=failures.join(' + ')||'Hết mạng làm việc';
    S.lastResult={title:cardObj.title,choice:choice.label,message:fullMessage,delta,queued,failureNotes};
    saveHighScore();
    safeSave();
    render();
    Snd.over();
    return;
  }

  S.lastResult={
    title:cardObj.title,choice:choice.label,message:fullMessage,
    delta,queued,failureNotes,callback:cardObj.type==='callback',bonus:reward
  };
  S.stage='result';
  safeSave();
  render();
}

function proceed(){
  if(S.stage!=='result')return;
  Snd.click();
  if(S.turn>=8)finishDay();
  else prepare();
}

function finishDay(){
  const before={e:S.e,b:S.b,r:S.r,lives:S.lives};
  let notes=[];
  if(S.b>=6){S.r=Math.max(0,S.r-1);notes.push('Backlog cao (≥6): uy tín −1.');}
  if(S.r<=0){
    if(!S.lastTurnLostLife){
      S.lives--;
      notes.push('Uy tín về 0 lúc tổng kết: mất 1 mạng.');
    }else{
      notes.push('Uy tín về 0, nhưng lượt cuối đã mất mạng nên không trừ mạng lần thứ hai.');
    }
    S.r=2;
  }
  S.maxDay=S.day;

  // Day survival achievement
  if(S.lives>0){
    S.score+=40;
    notes.push('Hoàn thành ngày làm việc: +40 điểm.');
    if(S.day>=3)unlockAch('day3');
    if(S.day>=7)unlockAch('day7');
    if(S.day>=10)unlockAch('day10');
  }

  const breakdown=statChange(before,{e:S.e,b:S.b,r:S.r,lives:S.lives});
  S.dayEnd={
    day:S.day,notes,delta:breakdown,daysurvived:S.lives>0,
    scoreGained:S.score-S.dailyStart.score,callbackCount:S.triggerCount
  };

  if(S.lives<=0){
    S.stage='over';
    S.deathReason='Mất hết uy tín lúc tổng kết ngày';
    saveHighScore();
    safeSave();
    render();
    Snd.over();
    return;
  }

  S.stage='day';
  safeSave();
  render();
  Snd.dayClear();
}

function pickPerk(perkId){
  if(!Array.isArray(S.perks))S.perks=[];
  if(!S.perks.includes(perkId)){
    S.perks.push(perkId);
    if(S.perks.length>=3)unlockAch('perk_buff');
    const p=ALL_PERKS.find(x=>x.id===perkId);
    toast(`Đã nhận phúc lợi: ${p?.emoji||'🎁'} ${p?.name||perkId}`);
    Snd.perk();
  }
  nextDay();
}

function nextDay(){
  if(S.stage!=='day')return;
  Snd.click();
  S.day++;
  S.turn=0;
  S.lastTurnLostLife=false;
  S.cleanBonus=0;
  const energyRecover=hasPerk('thermos')?5:4;
  S.e=Math.min(10,S.e+energyRecover);
  S.modifier=S.day<=2?'normal':pick(MODIFIERS).id;
  S.dailyStart={lives:S.lives,e:S.e,b:S.b,r:S.r,score:S.score};
  prepare();
}

function reset(){
  if(S&&S.stage!=='over'&&!confirm('Chơi lại từ Ngày 1? Tiến trình hiện tại sẽ bị xoá.'))return;

    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <h2 id="helpTitle">📎 Sổ tay nhân viên</h2>
      <p><b>Mục tiêu:</b> Sống sót càng nhiều ngày càng tốt. Mỗi ngày có 8 sự kiện; sự kiện cuối là lúc 17:59 trước giờ tan tầm.</p>
      <p><b>❤️ Mạng:</b> Bắt đầu với 3 mạng. Hết mạng là hợp đồng bị chấm dứt (Game Over).</p>
      <p><b>⚡ Năng lượng:</b> Về 0 mất 1 mạng rồi được cấp cứu hồi 3; sang ngày mới hồi tối đa 4 (hoặc 5 nếu có Bình giữ nhiệt).</p>
      <p><b>📋 Việc tồn:</b> Chạm 8 mất 1 mạng rồi giảm về 5. Nếu hết ngày còn ≥6, uy tín bị giảm 1.</p>
      <p><b>⭐ Uy tín:</b> Về 0 ở cuối ngày sẽ mất 1 mạng rồi hồi 2.</p>
      <p><b>🎁 Phúc lợi (Perks):</b> Hoàn thành mỗi ngày bạn được chọn 1 vật phẩm hỗ trợ mang theo suốt run.</p>
      <p><b>🔁 Nghiệp quật:</b> Lựa chọn hôm nay có thể là quả đắng (hoặc quả ngọt) vài lượt sau.</p>
      <p><b>🎲 May rủi:</b> Các lựa chọn có xúc xắc luôn hiển thị tỷ lệ thành công dự kiến.</p>
      <p><b>🏆 Điểm số:</b> +10/lượt, +40/ngày vượt qua, +5/việc xử lý (tối đa 20 điểm/ngày), +15/hậu quả giải quyết.</p>
      <button class="secondary" data-act="close">ĐÃ HIỂU — QUAY LẠI GAME</button>
    </section>
  </div>`;
}

function history(){
  Snd.click();
  let hist=S?.history||[];
  HOST.innerHTML=`<div class="dialogShade"><section class="dialog" role="dialog" aria-modal="true">
    <h2>📖 Nhật ký công sở</h2>
    <p class="note">15 sự kiện gần nhất trong run này.</p>
    <div style="border:2px solid var(--ink);border-radius:12px;background:#fff;padding:10px 12px;margin:10px 0;max-height:55vh;overflow:auto">
      ${hist.length?hist.map(h=>`<div style="font-size:12px;line-height:1.5;padding:7px 0;border-bottom:1px solid #dedce7"><b>Ngày ${h.day} · ${h.time}</b> — ${esc(h.card)}<br><span style="color:#6a6683">↳ ${esc(h.choice)}</span></div>`).join(''):'<p class="note">Chưa có sự kiện nào.</p>'}
    </div>
    <button class="secondary" data-act="close">ĐÓNG</button>
  </section></div>`;
}

function openCompendium(){
  Snd.click();
  const disc=getDiscovered();
  const allCards=Object.values(C);
  const total=allCards.length;
  const count=disc.length;

  HOST.innerHTML=`<div class="dialogShade"><section class="dialog" role="dialog" aria-modal="true">
    <h2>📚 Sổ tay sự kiện</h2>
    <p class="note">Đã mở khoá: <b>${count}/${total}</b> thẻ (${Math.round(count/total*100)}%)</p>
    <div style="max-height:58vh;overflow:auto;padding-right:4px" class="compendiumGrid">
      ${allCards.map(c=>{
        const isUnlocked=disc.includes(c.id);
        const tagMap={base:'Cơ bản',callback:'Nghiệp quật',crisis:'Khủng hoảng',rare:'Hiếm',finale:'Chốt ngày'};
        if(!isUnlocked){
          return `<div class="compCard locked">
            <div class="compCardHead"><span>🔒 ???</span><span class="compTag">${tagMap[c.type]||c.type}</span></div>
            <div>Sự kiện này chưa xảy ra với bạn...</div>
          </div>`;
        }
        return `<div class="compCard">
          <div class="compCardHead">
            <span>${c.emoji} <b>${esc(c.title)}</b></span>
            <span class="compTag">${tagMap[c.type]||c.type}</span>
          </div>
          <div style="color:#65627a;font-size:11px;margin-bottom:3px">Từ: ${esc(c.who)}</div>
          <div style="font-style:italic;color:#333146">${esc(c.body.slice(0,90))}${c.body.length>90?'...':''}</div>
        </div>`;
      }).join('')}
    </div>
    <button class="secondary" data-act="close" style="margin-top:12px">ĐÓNG</button>
  </section></div>`;
}

function openRankings(){
  Snd.click();
  const scores=getHighScores();
  const achs=getAchs();
  HOST.innerHTML=`<div class="dialogShade"><section class="dialog" role="dialog" aria-modal="true">
    <h2>🏆 Bảng vàng & Thành tích</h2>
    
    <div class="eyebrow" style="margin:12px 0 6px">🏅 TOP 5 RUN XUẤT SẮC NHẤT</div>
    <div style="border:2px solid var(--ink);border-radius:12px;background:#fff;padding:8px 12px;margin-bottom:14px">
      ${scores.length?scores.map((s,i)=>`
        <div class="scoreRow">
          <div><span class="scoreRank">${i+1}</span><b>${s.score.toLocaleString('vi-VN')} đ</b> · Ngày ${s.day}</div>
          <div style="font-size:11px;color:#6b6782">${esc(s.date)}</div>
        </div>
      `).join(''):'<p class="note">Chưa có kỷ lục nào được ghi nhận.</p>'}
    </div>

    <div class="eyebrow" style="margin:12px 0 6px">🎖️ HUY HIỆU ĐÃ MỞ KHOÁ (${achs.length}/${ALL_ACHS.length})</div>
    <div style="max-height:35vh;overflow:auto" class="achGrid">
      ${ALL_ACHS.map(a=>{
        const isUnlocked=achs.includes(a.id);
        return `<div class="achItem ${isUnlocked?'unlocked':'locked'}">
          <div class="achIcon">${a.icon}</div>
          <div>
            <div class="achName">${esc(a.name)} ${isUnlocked?'✓':''}</div>
            <div class="achDesc">${esc(a.desc)}</div>
          </div>
        </div>`;
      }).join('')}
    </div>

    <button class="secondary" data-act="close" style="margin-top:14px">ĐÓNG</button>
  </section></div>`;
}

function toast(s){
  const t=document.createElement('div');
  t.className='toast';
  t.textContent=s;
  document.body.append(t);
  setTimeout(()=>t.remove(),2400);
}

function share(){
  const msg=`Tui sống sót đến Ngày ${S.day} trong OFFICE SURVIVAL 🧑‍💻💥\n🏆 ${S.score.toLocaleString('vi-VN')} điểm | 🃏 ${S.total} sự kiện | 🔁 ${S.triggerCount||0} lần nghiệp quật\nDanh hiệu: ${titleEnd()}`;
  if(navigator.share){
    navigator.share({title:'Office Survival',text:msg}).catch(()=>{});
  }else if(navigator.clipboard){
    navigator.clipboard.writeText(msg).then(()=>toast('Đã sao chép kết quả vào bộ nhớ tạm!')).catch(()=>toast('Không thể sao chép trên trình duyệt này.'));
  }else toast('Chia sẻ không khả dụng trên trình duyệt này.');
}

// ==================== EVENT LISTENERS ====================
document.addEventListener('click',ev=>{
  const btn=ev.target.closest('[data-act],[data-choice],[data-perk]');
  if(!btn)return;

  const perkId=btn.getAttribute('data-perk');
  if(perkId){
    pickPerk(perkId);
    return;
  }

  const choice=btn.getAttribute('data-choice');
  if(choice!==null){
    doChoice(+choice);
    return;
  }

  switch(btn.dataset.act){
    case'start':
      if(safeLoad()&&!confirm('Bắt đầu run mới? Tiến trình cũ sẽ bị thay thế.'))return;
      Snd.click();
      start();
      break;
    case'continue':
      S=safeLoad();
      Snd.click();
      if(S)render();else start();
      break;
    case'proceed':proceed();break;
    case'nextday':nextDay();break;
    case'restart':Snd.click();reset();break;
    case'history':history();break;
    case'highscores':openRankings();break;
    case'close':
      Snd.click();
      HOST.innerHTML='';
      break;
    case'share':share();break;
  }
});

document.getElementById('audioToggle').addEventListener('click',()=>{
  const isMuted=Snd.toggle();
  document.getElementById('audioToggle').textContent=isMuted?'🔇':'🔊';
  toast(isMuted?'Đã tắt âm thanh':'Đã bật âm thanh');
});
document.getElementById('compBtn').addEventListener('click',openCompendium);
document.getElementById('rankBtn').addEventListener('click',openRankings);
document.getElementById('help').addEventListener('click',openHelp);

document.addEventListener('keydown',e=>{
  if(HOST.innerHTML){
    if(e.key==='Escape')HOST.innerHTML='';
    return;
  }
  const key=e.key.toLowerCase();
  if(S?.stage==='play'){
    if(/^[123]$/.test(key))doChoice(Number(key)-1);
    else if(key==='a')doChoice(0);
    else if(key==='b')doChoice(1);
    else if(key==='c')doChoice(2);
  }else if((e.key==='Enter'||e.key===' ')&&S?.stage==='result'){
    e.preventDefault();
    proceed();
  }else if((e.key==='Enter'||e.key===' ')&&S?.stage==='day'){
    e.preventDefault();
    nextDay();
  }
  if(key==='h'&&!HOST.innerHTML)history();
  if(key==='m'){
    const isMuted=Snd.toggle();
    document.getElementById('audioToggle').textContent=isMuted?'🔇':'🔊';
    toast(isMuted?'Đã tắt âm thanh':'Đã bật âm thanh');
  }
});

if(safeLoad()){S=safeLoad();render();}else render();

window.OfficeSurvivalTest={
  getState:()=>structuredClone(S),
  setState:(s)=>{S=s;render();},
  getCards:()=>C,
  getPerks:()=>ALL_PERKS,
  newRun:start,
  choose:doChoice,
  next:proceed,
  finishDay,
  nextDay,
  pickPerk,
  openCompendium,
  openRankings
};
})();
</script>
</body>
</html>
