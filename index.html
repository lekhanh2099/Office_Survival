<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17172b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Office Survival">
  <meta name="description" content="Office Survival - Sinh tồn chốn công sở, một game thẻ bài hài phi lý có chiến thuật, chơi offline.">
  <title>Office Survival — Đừng để công ty nuốt chửng bạn</title>
  
  <!-- PWA & Favicon -->
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app" id="appRoot">
    <header class="top">
      <div class="brand">
        <span class="brandMark">OS!</span>
        <span class="brandText">OFFICE SURVIVAL</span>
      </div>
      <div class="topActions">
        <button id="modeSwitchBtn" class="miniButton modeToggle" type="button" title="Chuyển chế độ Đấu Bài Meme / Cốt Truyện">
          <span class="btnIcon">🃏</span><span class="btnText">Đấu Bài</span>
        </button>
        <button id="donateBtn" class="miniButton donateHeadBtn" type="button" title="Góc tiếp tế Dev">
          <span class="btnIcon">🧋</span><span class="btnText">Tiếp tế</span>
        </button>
        <button id="compBtn" class="miniButton" type="button" title="Sổ tay sự kiện">
          <span class="btnIcon">📚</span><span class="btnText">Sổ tay</span>
        </button>
        <button id="rankBtn" class="miniButton" type="button" title="Bảng kỷ lục">
          <span class="btnIcon">🏆</span><span class="btnText">Kỷ lục</span>
        </button>
        <button id="audioToggle" class="miniButton iconOnly" type="button" title="Bật/Tắt âm thanh" aria-label="Bật hoặc tắt âm thanh">🔊</button>
        <button id="help" class="miniButton iconOnly" type="button" title="Luật chơi">❔</button>
      </div>
    </header>
    <main id="root" aria-live="polite"></main>
    <footer class="privacy">Office Survival v1.0 · PWA & Offline · Dữ liệu lưu trên thiết bị</footer>
  </div>
  <div id="dialogHost"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
